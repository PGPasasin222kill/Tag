<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b0a" />
  <meta name="description" content="Digital profile — Founder @ Noi DA!" />
  <title>whoami</title>
  <style>
    :root{
      --bg:#080b0a; --panel:#0d1210; --text:#f3f7f4; --muted:#8f9d95;
      --accent:#39ff88; --accent-soft:rgba(57,255,136,.11); --line:rgba(255,255,255,.10);
      --shadow:0 18px 55px rgba(0,0,0,.42); --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0; min-height:100%;
      background:
        radial-gradient(circle at 20% 0%, rgba(57,255,136,.08), transparent 32rem),
        linear-gradient(180deg,#070908 0%,var(--bg) 100%);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body{min-height:100svh;display:grid;place-items:center;padding:24px 16px;overflow-x:hidden}
    .wrap{width:min(100%,520px)}
    .card{
      position:relative;
      background:linear-gradient(180deg,rgba(14,20,17,.97),rgba(9,13,11,.97));
      border:1px solid var(--line); border-radius:var(--radius); padding:26px;
      box-shadow:var(--shadow); overflow:hidden;
    }
    .card::before{
      content:""; position:absolute; left:0; right:0; top:0; height:2px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.8;
    }
    .terminal{
      display:flex;gap:9px;align-items:center;color:var(--accent);
      font:600 14px/1.2 "SFMono-Regular",Consolas,"Liberation Mono",monospace;
      margin-bottom:28px;letter-spacing:.02em
    }
    .cursor{
      width:8px;height:16px;background:var(--accent);display:inline-block;
      animation:blink 1.1s steps(1,end) infinite;box-shadow:0 0 14px rgba(57,255,136,.55)
    }
    @keyframes blink{50%{opacity:0}}
    .eyebrow{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.16em;margin-bottom:9px}
    h1{margin:0;font-size:clamp(34px,8vw,54px);line-height:.98;letter-spacing:-.045em}
    .role{margin-top:12px;font-size:18px;font-weight:650}
    .role b{color:var(--accent);font-weight:750}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 26px}
    .tag{
      padding:8px 11px;border-radius:999px;border:1px solid rgba(57,255,136,.22);
      background:var(--accent-soft);color:#cffff0;font-size:12px;font-weight:650
    }
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{
      appearance:none;text-decoration:none;border:1px solid var(--line);color:var(--text);
      background:rgba(255,255,255,.025);border-radius:15px;min-height:52px;padding:0 15px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;
      transition:.18s ease;cursor:pointer;font-family:inherit;font-size:14px
    }
    .btn:hover{transform:translateY(-2px);border-color:rgba(57,255,136,.42);background:rgba(57,255,136,.07)}
    .btn.primary{grid-column:1/-1;background:var(--accent);color:#061008;border-color:var(--accent)}
    .btn.primary:hover{background:#65ffa0;box-shadow:0 10px 30px rgba(57,255,136,.14)}
    .arrow{color:inherit;opacity:.7;font-family:monospace}
    .divider{height:1px;background:var(--line);margin:26px 0 20px}
    .status{display:grid;gap:9px;color:var(--muted);font:500 12px/1.55 "SFMono-Regular",Consolas,monospace}
    .status span{color:#d7e5dc}.status .ok{color:var(--accent)}
    .ps{margin-top:22px;color:#aab6af;font-size:13px;line-height:1.55}.ps strong{color:var(--text)}
    .footer{text-align:center;margin-top:14px;color:#647069;font:500 11px/1.5 "SFMono-Regular",Consolas,monospace}
    @media(max-width:420px){.card{padding:22px 18px}.actions{grid-template-columns:1fr}.btn.primary{grid-column:auto}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="terminal"><span>&gt; whoami</span><span class="cursor"></span></div>
      <div class="eyebrow">digital profile</div>
      <h1 id="name">PGP_asasin222kil</h1>
      <div class="role">Founder @ <b>Noi DA!</b></div>
      <div class="tags">
        <span class="tag">Cybersecurity</span>
        <span class="tag">CTF</span>
        <span class="tag">Builder</span>
      </div>
      <div class="actions">
        <a class="btn" id="linkedin" href="#" target="_blank" rel="noopener"><span>LinkedIn</span><span class="arrow">↗</span></a>
        <a class="btn" id="github" href="#" target="_blank" rel="noopener"><span>GitHub</span><span class="arrow">↗</span></a>
        <a class="btn" id="noida" href="#" target="_blank" rel="noopener"><span>Noi DA!</span><span class="arrow">↗</span></a>
        <a class="btn" id="email" href="#"><span>Email</span><span class="arrow">→</span></a>
        <button class="btn primary" id="saveContact"><span>Save contact</span><span class="arrow">＋</span></button>
      </div>
      <div class="divider"></div>
      <div class="status">
        <div>status: <span class="ok">online</span></div>
        <div>mode: <span>probably building something</span></div>
        <div>signal: <span>NFC handshake accepted</span></div>
      </div>
      <div class="ps"><strong>ps:</strong> if you scanned this at a CTF, come say hi :)</div>
    </section>
    <div class="footer">tap • connect • build</div>
  </main>
<script>
const PROFILE = {
  name: "PGP_asasin222kil",
  email: "soon@soon.ro",
  phone: "+40 770 Nu",
  linkedin: "https://www.linkedin.com/in/nu-inca",
  github: "https://github.com/PGPasasin222kill",
  noida: "https://soon.com",
  website: "https://soon.com"
};

document.title = PROFILE.name + " — whoami";
document.getElementById("name").textContent = PROFILE.name;
document.getElementById("linkedin").href = PROFILE.linkedin;
document.getElementById("github").href = PROFILE.github;
document.getElementById("noida").href = PROFILE.noida;
document.getElementById("email").href = "mailto:" + PROFILE.email;

document.getElementById("saveContact").addEventListener("click", () => {
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "FN:" + PROFILE.name,
    "ORG:Noi DA!",
    "TITLE:Founder",
    "EMAIL:" + PROFILE.email,
    "TEL:" + PROFILE.phone,
    "URL:" + PROFILE.website,
    "NOTE:Cybersecurity • CTF • Builder",
    "END:VCARD"
  ].join("\r\n");
  const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = PROFILE.name.replace(/\s+/g, "_") + ".vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
